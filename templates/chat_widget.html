<!-- Career Coach AI Chat Widget -->
<style>
    #chat-bubble-btn {
        position: fixed;
        bottom: 1.5rem;
        right: 1.5rem;
        z-index: 9999;
        width: 56px;
        height: 56px;
        border-radius: 50%;
        background: linear-gradient(135deg, #2563eb, #1d4ed8);
        color: white;
        border: none;
        cursor: pointer;
        box-shadow: 0 4px 12px rgba(37, 99, 235, 0.4);
        display: flex;
        align-items: center;
        justify-content: center;
        transition: transform 0.2s, box-shadow 0.2s;
    }
    #chat-bubble-btn:hover {
        transform: scale(1.08);
        box-shadow: 0 6px 20px rgba(37, 99, 235, 0.5);
    }
    #chat-panel {
        position: fixed;
        bottom: 5.5rem;
        right: 1.5rem;
        z-index: 9998;
        width: 380px;
        height: 520px;
        background: white;
        border-radius: 16px;
        box-shadow: 0 8px 30px rgba(0, 0, 0, 0.15);
        display: none;
        flex-direction: column;
        overflow: hidden;
    }
    #chat-panel.open {
        display: flex;
    }
    .chat-header {
        background: linear-gradient(135deg, #2563eb, #1d4ed8);
        color: white;
        padding: 14px 16px;
        display: flex;
        align-items: center;
        justify-content: space-between;
        flex-shrink: 0;
    }
    .chat-header-title {
        font-weight: 600;
        font-size: 15px;
    }
    .chat-clear-btn {
        background: rgba(255,255,255,0.2);
        color: white;
        border: none;
        padding: 4px 12px;
        border-radius: 6px;
        cursor: pointer;
        font-size: 12px;
    }
    .chat-clear-btn:hover {
        background: rgba(255,255,255,0.35);
    }
    #chat-messages {
        flex: 1;
        overflow-y: auto;
        padding: 12px;
        display: flex;
        flex-direction: column;
        gap: 8px;
    }
    .chat-msg {
        max-width: 85%;
        padding: 10px 14px;
        border-radius: 14px;
        font-size: 13.5px;
        line-height: 1.45;
        word-wrap: break-word;
    }
    .chat-msg.user {
        align-self: flex-end;
        background: #2563eb;
        color: white;
        border-bottom-right-radius: 4px;
    }
    .chat-msg.assistant {
        align-self: flex-start;
        background: #f3f4f6;
        color: #1f2937;
        border-bottom-left-radius: 4px;
    }
    .chat-action-btn {
        display: inline-block;
        margin-top: 8px;
        padding: 6px 14px;
        background: #2563eb;
        color: white;
        border-radius: 8px;
        text-decoration: none;
        font-size: 12.5px;
        font-weight: 500;
        transition: background 0.2s;
    }
    .chat-action-btn:hover {
        background: #1d4ed8;
        color: white;
    }
    .chat-tool-status {
        display: flex;
        align-items: center;
        gap: 6px;
        margin-top: 6px;
        font-size: 12px;
        color: #6b7280;
        font-style: italic;
        opacity: 0.85;
    }
    .chat-tool-spinner {
        display: inline-block;
        width: 10px;
        height: 10px;
        border: 2px solid #d1d5db;
        border-top-color: #6b7280;
        border-radius: 50%;
        animation: chat-spin 0.7s linear infinite;
        flex-shrink: 0;
    }
    @keyframes chat-spin {
        to { transform: rotate(360deg); }
    }
    #chat-typing {
        display: none;
        align-self: flex-start;
        padding: 10px 14px;
        background: #f3f4f6;
        border-radius: 14px;
        border-bottom-left-radius: 4px;
    }
    .typing-dots {
        display: flex;
        gap: 4px;
    }
    .typing-dots span {
        width: 7px;
        height: 7px;
        background: #9ca3af;
        border-radius: 50%;
        animation: bounce 1.4s infinite;
    }
    .typing-dots span:nth-child(2) { animation-delay: 0.2s; }
    .typing-dots span:nth-child(3) { animation-delay: 0.4s; }
    @keyframes bounce {
        0%, 60%, 100% { transform: translateY(0); }
        30% { transform: translateY(-6px); }
    }
    .chat-input-area {
        display: flex;
        align-items: flex-end;
        padding: 10px 12px;
        border-top: 1px solid #e5e7eb;
        gap: 8px;
        flex-shrink: 0;
    }
    #chat-input {
        flex: 1;
        border: 1px solid #d1d5db;
        border-radius: 10px;
        padding: 8px 12px;
        font-size: 13.5px;
        resize: none;
        max-height: 80px;
        min-height: 36px;
        outline: none;
        font-family: inherit;
        line-height: 1.4;
    }
    #chat-input:focus {
        border-color: #2563eb;
        box-shadow: 0 0 0 2px rgba(37, 99, 235, 0.15);
    }
    #chat-send-btn {
        background: #2563eb;
        color: white;
        border: none;
        width: 36px;
        height: 36px;
        border-radius: 10px;
        cursor: pointer;
        display: flex;
        align-items: center;
        justify-content: center;
        flex-shrink: 0;
        transition: background 0.2s;
    }
    #chat-send-btn:hover { background: #1d4ed8; }
    #chat-send-btn:disabled { background: #93c5fd; cursor: not-allowed; }
    .chat-char-count {
        font-size: 11px;
        color: #9ca3af;
        text-align: right;
        padding: 0 14px 4px;
        flex-shrink: 0;
    }
    @media (max-width: 480px) {
        #chat-panel {
            width: calc(100vw - 1.5rem);
            right: 0.75rem;
            height: 70vh;
        }
    }
</style>

<!-- Chat Bubble Button -->
<button id="chat-bubble-btn" aria-label="Open Career Coach AI chat">
    <svg id="chat-icon-open" width="24" height="24" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
        <path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"></path>
    </svg>
    <svg id="chat-icon-close" width="24" height="24" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24" style="display:none;">
        <line x1="18" y1="6" x2="6" y2="18"></line>
        <line x1="6" y1="6" x2="18" y2="18"></line>
    </svg>
</button>

<!-- Chat Panel -->
<div id="chat-panel">
    <div class="chat-header">
        <span class="chat-header-title">Career Coach AI</span>
        <button class="chat-clear-btn" id="chat-clear-btn">Clear</button>
    </div>
    <div id="chat-messages">
        <div class="chat-msg assistant">
            Hi! I'm your Career Coach AI. I can help you find matching jobs, answer questions about your resume, run the job scout agent, and more. How can I help you today?
        </div>
    </div>
    <div id="chat-typing">
        <div class="typing-dots">
            <span></span><span></span><span></span>
        </div>
    </div>
    <div class="chat-char-count" id="chat-char-count"></div>
    <div class="chat-input-area">
        <textarea id="chat-input" placeholder="Ask me anything..." rows="1" maxlength="2000"></textarea>
        <button id="chat-send-btn" disabled aria-label="Send message">
            <svg width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
                <line x1="22" y1="2" x2="11" y2="13"></line>
                <polygon points="22 2 15 22 11 13 2 9 22 2"></polygon>
            </svg>
        </button>
    </div>
</div>

<script>
(function() {
    const bubbleBtn = document.getElementById('chat-bubble-btn');
    const panel = document.getElementById('chat-panel');
    const iconOpen = document.getElementById('chat-icon-open');
    const iconClose = document.getElementById('chat-icon-close');
    const messagesEl = document.getElementById('chat-messages');
    const typingEl = document.getElementById('chat-typing');
    const inputEl = document.getElementById('chat-input');
    const sendBtn = document.getElementById('chat-send-btn');
    const clearBtn = document.getElementById('chat-clear-btn');
    const charCountEl = document.getElementById('chat-char-count');

    let isOpen = false;
    let historyLoaded = false;

    function escapeHtml(text) {
        const div = document.createElement('div');
        div.textContent = text;
        return div.innerHTML;
    }

    function formatContent(text) {
        let formatted = escapeHtml(text);
        formatted = formatted.replace(/\*\*(.*?)\*\*/g, '<strong>$1</strong>');
        formatted = formatted.replace(/\n/g, '<br>');
        return formatted;
    }

    function scrollToBottom() {
        messagesEl.scrollTop = messagesEl.scrollHeight;
    }

    function appendMessage(role, content, intent, actionData) {
        const div = document.createElement('div');
        div.className = 'chat-msg ' + role;
        div.innerHTML = formatContent(content);
        attachActionButtons(div, intent, actionData);
        messagesEl.appendChild(div);
        scrollToBottom();
        return div;
    }

    function attachActionButtons(div, intent, actionData) {
        if (intent === 'redirect_to_jobs' && actionData && actionData.job_ids) {
            const ids = actionData.job_ids.join(',');
            div.insertAdjacentHTML('beforeend',
                '<br><a href="/jobs?ids=' + ids + '" class="chat-action-btn">View ' +
                actionData.job_ids.length + ' Matching Jobs</a>');
        }
        if (intent === 'open_tailor_modal' && actionData && actionData.job_id) {
            const job = actionData.job || {};
            const label = job.title ? job.title + (job.company ? ' at ' + job.company : '') : 'Job';
            const before = actionData.ats_before;
            const after  = actionData.ats_after;
            const scoreText = (before && before !== '?' && after && after !== '?')
                ? ' (' + before + '% → ' + after + '%)'
                : '';
            div.insertAdjacentHTML('beforeend',
                '<br><a href="/jobs?ids=' + actionData.job_id + '&tailor=' + actionData.job_id +
                '" target="_blank" class="chat-action-btn">View ATS Results for ' + label + scoreText + '</a>');
        }
    }

    function loadHistory() {
        fetch('/api/chat/history')
            .then(function(r) { return r.json(); })
            .then(function(data) {
                if (data.messages && data.messages.length > 0) {
                    // Clear default welcome message
                    messagesEl.innerHTML = '';
                    data.messages.forEach(function(msg) {
                        appendMessage(msg.role, msg.content, msg.intent, msg.action_data);
                    });
                }
                historyLoaded = true;
            })
            .catch(function(err) {
                console.error('Failed to load chat history:', err);
                historyLoaded = true;
            });
    }

    function togglePanel() {
        isOpen = !isOpen;
        if (isOpen) {
            panel.classList.add('open');
            iconOpen.style.display = 'none';
            iconClose.style.display = 'block';
            if (!historyLoaded) loadHistory();
            inputEl.focus();
        } else {
            panel.classList.remove('open');
            iconOpen.style.display = 'block';
            iconClose.style.display = 'none';
        }
    }

    // Streaming send — consumes Server-Sent Events from /api/chat/stream.
    // The reply div is created empty and tokens are appended as they arrive,
    // giving the user a typewriter effect and freeing the request thread
    // immediately after each chunk yields.
    async function sendMessage() {
        const text = inputEl.value.trim();
        if (!text) return;

        appendMessage('user', text);
        inputEl.value = '';
        inputEl.style.height = 'auto';
        sendBtn.disabled = true;
        charCountEl.textContent = '';

        typingEl.style.display = 'block';
        scrollToBottom();

        // The assistant message div we'll fill with tokens.
        let replyDiv = null;
        let replyText = '';

        function ensureReplyDiv() {
            if (replyDiv) return replyDiv;
            typingEl.style.display = 'none';
            replyDiv = document.createElement('div');
            replyDiv.className = 'chat-msg assistant';
            messagesEl.appendChild(replyDiv);
            return replyDiv;
        }

        try {
            const res = await fetch('/api/chat/stream', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ message: text })
            });

            if (!res.ok) {
                typingEl.style.display = 'none';
                if (res.status === 409) {
                    appendMessage('assistant', "Hold on — I'm still finishing your last message.");
                } else if (res.status === 429) {
                    appendMessage('assistant', 'You are sending messages too quickly. Please slow down.');
                } else {
                    const err = await res.json().catch(function() { return {}; });
                    appendMessage('assistant', 'Sorry, something went wrong: ' + (err.error || res.statusText));
                }
                return;
            }

            // Read the SSE stream chunk by chunk.
            const reader = res.body.getReader();
            const decoder = new TextDecoder();
            let buffer = '';

            while (true) {
                const { value, done } = await reader.read();
                if (done) break;
                buffer += decoder.decode(value, { stream: true });

                // SSE events are separated by a blank line.
                const events = buffer.split('\n\n');
                buffer = events.pop();   // last chunk may be incomplete

                for (const raw of events) {
                    // Skip comments (lines starting with ":") and other non-data lines.
                    const dataLines = raw.split('\n').filter(function(l) {
                        return l.startsWith('data: ');
                    });
                    if (dataLines.length === 0) continue;

                    const payload = dataLines.map(function(l) { return l.slice(6); }).join('\n');
                    let evt;
                    try { evt = JSON.parse(payload); } catch (e) { continue; }

                    if (evt.type === 'token') {
                        ensureReplyDiv();
                        replyText += evt.content;
                        replyDiv.innerHTML = formatContent(replyText);
                        scrollToBottom();
                    } else if (evt.type === 'tool_start' || evt.type === 'progress') {
                        ensureReplyDiv();
                        const label = evt.label || (evt.tool ? 'Running ' + evt.tool + '…' : 'Working…');
                        const statusHtml = '<div class="chat-tool-status"><span class="chat-tool-spinner"></span>' + label + '</div>';
                        if (replyText) {
                            replyDiv.innerHTML = formatContent(replyText) + statusHtml;
                        } else {
                            replyDiv.innerHTML = statusHtml;
                        }
                        scrollToBottom();
                    } else if (evt.type === 'tool_end') {
                        if (replyDiv && !replyText) {
                            replyDiv.innerHTML = '';
                        }
                    } else if (evt.type === 'done') {
                        ensureReplyDiv();
                        if (!replyText) replyText = '(no response)';
                        replyDiv.innerHTML = formatContent(replyText);
                        attachActionButtons(replyDiv, evt.intent, evt.action_data);
                        scrollToBottom();
                    } else if (evt.type === 'error') {
                        ensureReplyDiv();
                        replyDiv.innerHTML = formatContent(
                            'Sorry, I hit an error: ' + (evt.error || 'unknown')
                        );
                    }
                }
            }
        } catch (err) {
            typingEl.style.display = 'none';
            console.error('Chat stream failed:', err);
            if (!replyDiv) {
                appendMessage('assistant', 'Sorry, I had trouble connecting. Please try again.');
            }
        } finally {
            typingEl.style.display = 'none';
            sendBtn.disabled = !inputEl.value.trim();
        }
    }

    function clearHistory() {
        if (!confirm('Clear all chat history?')) return;
        fetch('/api/chat/history', { method: 'DELETE' })
            .then(function(r) { return r.json(); })
            .then(function(data) {
                if (data.success) {
                    messagesEl.innerHTML = '';
                    appendMessage('assistant', 'Chat history cleared. How can I help you?');
                }
            });
    }

    // Event listeners
    bubbleBtn.addEventListener('click', togglePanel);
    clearBtn.addEventListener('click', clearHistory);
    sendBtn.addEventListener('click', sendMessage);

    inputEl.addEventListener('input', function() {
        // Auto-resize
        this.style.height = 'auto';
        this.style.height = Math.min(this.scrollHeight, 80) + 'px';
        // Enable/disable send
        sendBtn.disabled = !this.value.trim();
        // Char count
        var len = this.value.length;
        charCountEl.textContent = len > 0 ? len + '/2000' : '';
    });

    inputEl.addEventListener('keydown', function(e) {
        if (e.key === 'Enter' && !e.shiftKey) {
            e.preventDefault();
            if (inputEl.value.trim()) sendMessage();
        }
    });
})();
</script>
