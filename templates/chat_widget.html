<!-- Career Coach AI Chat Widget -->
<style>
    #chat-bubble-btn {
        position: fixed;
        bottom: 1.5rem;
        right: 1.5rem;
        z-index: 9999;
        width: 56px;
        height: 56px;
        border-radius: 50%;
        background: linear-gradient(135deg, #2563eb, #1d4ed8);
        color: white;
        border: none;
        cursor: pointer;
        box-shadow: 0 4px 12px rgba(37, 99, 235, 0.4);
        display: flex;
        align-items: center;
        justify-content: center;
        transition: transform 0.2s, box-shadow 0.2s;
    }
    #chat-bubble-btn:hover {
        transform: scale(1.08);
        box-shadow: 0 6px 20px rgba(37, 99, 235, 0.5);
    }
    #chat-panel {
        position: fixed;
        bottom: 5.5rem;
        right: 1.5rem;
        z-index: 9998;
        width: 380px;
        height: 520px;
        background: white;
        border-radius: 16px;
        box-shadow: 0 8px 30px rgba(0, 0, 0, 0.15);
        display: none;
        flex-direction: column;
        overflow: hidden;
    }
    #chat-panel.open {
        display: flex;
    }
    .chat-header {
        background: linear-gradient(135deg, #2563eb, #1d4ed8);
        color: white;
        padding: 14px 16px;
        display: flex;
        align-items: center;
        justify-content: space-between;
        flex-shrink: 0;
    }
    .chat-header-title {
        font-weight: 600;
        font-size: 15px;
    }
    .chat-clear-btn {
        background: rgba(255,255,255,0.2);
        color: white;
        border: none;
        padding: 4px 12px;
        border-radius: 6px;
        cursor: pointer;
        font-size: 12px;
    }
    .chat-clear-btn:hover {
        background: rgba(255,255,255,0.35);
    }
    #chat-messages {
        flex: 1;
        overflow-y: auto;
        padding: 12px;
        display: flex;
        flex-direction: column;
        gap: 8px;
    }
    .chat-msg {
        max-width: 85%;
        padding: 10px 14px;
        border-radius: 14px;
        font-size: 13.5px;
        line-height: 1.45;
        word-wrap: break-word;
    }
    .chat-msg.user {
        align-self: flex-end;
        background: #2563eb;
        color: white;
        border-bottom-right-radius: 4px;
    }
    .chat-msg.assistant {
        align-self: flex-start;
        background: #f3f4f6;
        color: #1f2937;
        border-bottom-left-radius: 4px;
    }
    .chat-action-btn {
        display: inline-block;
        margin-top: 8px;
        padding: 6px 14px;
        background: #2563eb;
        color: white;
        border-radius: 8px;
        text-decoration: none;
        font-size: 12.5px;
        font-weight: 500;
        transition: background 0.2s;
    }
    .chat-action-btn:hover {
        background: #1d4ed8;
        color: white;
    }
    .chat-tool-status {
        display: flex;
        align-items: center;
        gap: 6px;
        margin-top: 6px;
        font-size: 12px;
        color: #6b7280;
        font-style: italic;
        opacity: 0.85;
    }
    .chat-tool-spinner {
        display: inline-block;
        width: 10px;
        height: 10px;
        border: 2px solid #d1d5db;
        border-top-color: #6b7280;
        border-radius: 50%;
        animation: chat-spin 0.7s linear infinite;
        flex-shrink: 0;
    }
    @keyframes chat-spin {
        to { transform: rotate(360deg); }
    }
    #chat-typing {
        display: none;
        align-self: flex-start;
        padding: 10px 14px;
        background: #f3f4f6;
        border-radius: 14px;
        border-bottom-left-radius: 4px;
    }
    .typing-dots {
        display: flex;
        gap: 4px;
    }
    .typing-dots span {
        width: 7px;
        height: 7px;
        background: #9ca3af;
        border-radius: 50%;
        animation: bounce 1.4s infinite;
    }
    .typing-dots span:nth-child(2) { animation-delay: 0.2s; }
    .typing-dots span:nth-child(3) { animation-delay: 0.4s; }
    @keyframes bounce {
        0%, 60%, 100% { transform: translateY(0); }
        30% { transform: translateY(-6px); }
    }
    .chat-input-area {
        display: flex;
        align-items: flex-end;
        padding: 10px 12px;
        border-top: 1px solid #e5e7eb;
        gap: 8px;
        flex-shrink: 0;
    }
    #chat-input {
        flex: 1;
        border: 1px solid #d1d5db;
        border-radius: 10px;
        padding: 8px 12px;
        font-size: 13.5px;
        resize: none;
        max-height: 80px;
        min-height: 36px;
        outline: none;
        font-family: inherit;
        line-height: 1.4;
    }
    #chat-input:focus {
        border-color: #2563eb;
        box-shadow: 0 0 0 2px rgba(37, 99, 235, 0.15);
    }
    #chat-send-btn {
        background: #2563eb;
        color: white;
        border: none;
        width: 36px;
        height: 36px;
        border-radius: 10px;
        cursor: pointer;
        display: flex;
        align-items: center;
        justify-content: center;
        flex-shrink: 0;
        transition: background 0.2s;
    }
    #chat-send-btn:hover { background: #1d4ed8; }
    #chat-send-btn:disabled { background: #93c5fd; cursor: not-allowed; }
    .chat-char-count {
        font-size: 11px;
        color: #9ca3af;
        text-align: right;
        padding: 0 14px 4px;
        flex-shrink: 0;
    }
    @media (max-width: 480px) {
        #chat-panel {
            width: calc(100vw - 1.5rem);
            right: 0.75rem;
            height: 70vh;
        }
    }
</style>

<!-- Chat Bubble Button -->
<button id="chat-bubble-btn" aria-label="Open Career Coach AI chat">
    <svg id="chat-icon-open" width="24" height="24" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
        <path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"></path>
    </svg>
    <svg id="chat-icon-close" width="24" height="24" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24" style="display:none;">
        <line x1="18" y1="6" x2="6" y2="18"></line>
        <line x1="6" y1="6" x2="18" y2="18"></line>
    </svg>
</button>

<!-- Chat Panel -->
<div id="chat-panel">
    <div class="chat-header">
        <span class="chat-header-title">Career Coach AI</span>
        <button class="chat-clear-btn" id="chat-clear-btn">Clear</button>
    </div>
    <div id="chat-messages">
        <div class="chat-msg assistant">
            Hi! I'm your Career Coach AI. I can help you find matching jobs, answer questions about your resume, run the job scout agent, and more. How can I help you today?
        </div>
    </div>
    <div id="chat-typing">
        <div class="typing-dots">
            <span></span><span></span><span></span>
        </div>
    </div>
    <div class="chat-char-count" id="chat-char-count"></div>
    <div class="chat-input-area">
        <textarea id="chat-input" placeholder="Ask me anything..." rows="1" maxlength="2000"></textarea>
        <button id="chat-cancel-btn" aria-label="Stop generating" style="display:none;background:#ef4444;color:white;border:none;width:36px;height:36px;border-radius:10px;cursor:pointer;flex-shrink:0;">
            <svg width="16" height="16" fill="currentColor" viewBox="0 0 24 24"><rect x="6" y="6" width="12" height="12" rx="2"/></svg>
        </button>
        <button id="chat-send-btn" disabled aria-label="Send message">
            <svg width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
                <line x1="22" y1="2" x2="11" y2="13"></line>
                <polygon points="22 2 15 22 11 13 2 9 22 2"></polygon>
            </svg>
        </button>
    </div>
</div>

<script src="/static/js/socket.io.min.js"></script>
<script>
(function() {
    const bubbleBtn = document.getElementById('chat-bubble-btn');
    const panel = document.getElementById('chat-panel');
    const iconOpen = document.getElementById('chat-icon-open');
    const iconClose = document.getElementById('chat-icon-close');
    const messagesEl = document.getElementById('chat-messages');
    const typingEl = document.getElementById('chat-typing');
    const inputEl = document.getElementById('chat-input');
    const sendBtn = document.getElementById('chat-send-btn');
    const cancelBtn = document.getElementById('chat-cancel-btn');
    const clearBtn = document.getElementById('chat-clear-btn');
    const charCountEl = document.getElementById('chat-char-count');

    let isOpen = false;
    let historyLoaded = false;
    let isStreaming = false;
    let replyDiv = null;
    let replyText = '';

    const socket = io({ autoConnect: false });

    function escapeHtml(text) {
        const div = document.createElement('div');
        div.textContent = text;
        return div.innerHTML;
    }

    function formatContent(text) {
        let formatted = escapeHtml(text);
        formatted = formatted.replace(/\*\*(.*?)\*\*/g, '<strong>$1</strong>');
        formatted = formatted.replace(/\n/g, '<br>');
        return formatted;
    }

    function scrollToBottom() {
        messagesEl.scrollTop = messagesEl.scrollHeight;
    }

    function appendMessage(role, content, intent, actionData) {
        const div = document.createElement('div');
        div.className = 'chat-msg ' + role;
        div.innerHTML = formatContent(content);
        attachActionButtons(div, intent, actionData);
        messagesEl.appendChild(div);
        scrollToBottom();
        return div;
    }

    function chatActionButton(label) {
        const btn = document.createElement('button');
        btn.className = 'chat-action-btn';
        btn.type = 'button';
        btn.textContent = label;          // textContent, never innerHTML
        return btn;
    }

    function chatActionLink(href, label) {
        const a = document.createElement('a');
        a.className = 'chat-action-btn';
        a.href = href;
        a.textContent = label;            // textContent, never innerHTML
        return a;
    }

    function attachActionButtons(div, intent, actionData) {
        if (!actionData) return;

        if (intent === 'redirect_to_jobs' && actionData.job_ids) {
            const ids = actionData.job_ids.join(',');
            const label = 'View ' + actionData.job_ids.length + ' Matching Jobs';
            div.appendChild(document.createElement('br'));
            div.appendChild(chatActionLink('/jobs?ids=' + encodeURIComponent(ids), label));
        }

        if (intent === 'open_tailor_modal' && actionData.job_id) {
            // job.title and job.company originate from external job boards.
            // They MUST go through textContent — building this with
            // insertAdjacentHTML was a stored XSS.
            const job = actionData.job || {};
            const name = job.title
                ? job.title + (job.company ? ' at ' + job.company : '')
                : 'Job';
            const before = actionData.ats_before;
            const after = actionData.ats_after;
            const score = (before && before !== '?' && after && after !== '?')
                ? ' (' + before + '% → ' + after + '%)'
                : '';
            const id = encodeURIComponent(actionData.job_id);
            const link = chatActionLink(
                '/jobs?ids=' + id + '&tailor=' + id,
                'View ATS Results for ' + name + score
            );
            link.target = '_blank';
            link.rel = 'noopener noreferrer';
            div.appendChild(document.createElement('br'));
            div.appendChild(link);
        }

        if (intent === 'confirm_required' && actionData.nonce) {
            // The label embeds the user's plan goal — untrusted text, so
            // textContent only (chatActionButton handles that).
            const btn = chatActionButton(actionData.label || 'Confirm');
            btn.addEventListener('click', function () {
                btn.disabled = true;
                btn.textContent = 'Working…';
                fetch('/api/chat/confirm', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ nonce: actionData.nonce })
                })
                    .then(function (r) { return r.json(); })
                    .catch(function () { return { success: false, error: 'Network error.' }; })
                    .then(function (data) {
                        btn.remove();
                        // The result is rendered directly, NOT sent back through
                        // the LLM — the outcome of a destructive action must not
                        // be reportable by a hallucination.
                        const out = document.createElement('div');
                        out.className = 'chat-msg assistant';
                        out.innerHTML = formatContent(
                            data.message || data.error || 'Done.'
                        );
                        messagesEl.appendChild(out);
                        scrollToBottom();
                    });
            });
            div.appendChild(document.createElement('br'));
            div.appendChild(btn);
        }
    }

    function ensureReplyDiv() {
        if (replyDiv) return replyDiv;
        typingEl.style.display = 'none';
        replyDiv = document.createElement('div');
        replyDiv.className = 'chat-msg assistant';
        messagesEl.appendChild(replyDiv);
        return replyDiv;
    }

    function setStreaming(active) {
        isStreaming = active;
        cancelBtn.style.display = active ? 'flex' : 'none';
        sendBtn.style.display = active ? 'none' : 'flex';
        if (!active) {
            sendBtn.disabled = !inputEl.value.trim();
        }
    }

    function finishStream() {
        typingEl.style.display = 'none';
        setStreaming(false);
        replyDiv = null;
        replyText = '';
    }

    // Socket.IO event handlers
    socket.on('token', function(data) {
        ensureReplyDiv();
        replyText += data.content;
        replyDiv.innerHTML = formatContent(replyText);
        scrollToBottom();
    });

    socket.on('tool_start', function(data) {
        ensureReplyDiv();
        var label = data.label || ('Running ' + data.tool + '…');
        var statusHtml = '<div class="chat-tool-status"><span class="chat-tool-spinner"></span>' + label + '</div>';
        replyDiv.innerHTML = (replyText ? formatContent(replyText) : '') + statusHtml;
        scrollToBottom();
    });

    socket.on('progress', function(data) {
        ensureReplyDiv();
        var statusHtml = '<div class="chat-tool-status"><span class="chat-tool-spinner"></span>' + data.label + '</div>';
        replyDiv.innerHTML = (replyText ? formatContent(replyText) : '') + statusHtml;
        scrollToBottom();
    });

    socket.on('tool_end', function() {
        if (replyDiv && !replyText) {
            replyDiv.innerHTML = '';
        }
    });

    socket.on('done', function(data) {
        ensureReplyDiv();
        if (!replyText) replyText = '(no response)';
        replyDiv.innerHTML = formatContent(replyText);
        attachActionButtons(replyDiv, data.intent, data.action_data);
        scrollToBottom();
        finishStream();
    });

    socket.on('error', function(data) {
        ensureReplyDiv();
        replyDiv.innerHTML = formatContent('Sorry, I hit an error: ' + (data.error || 'unknown'));
        finishStream();
    });

    socket.on('connect_error', function() {
        if (isStreaming) {
            appendMessage('assistant', 'Connection lost. Please try again.');
            finishStream();
        }
    });

    function loadHistory() {
        fetch('/api/chat/history')
            .then(function(r) { return r.json(); })
            .then(function(data) {
                if (data.messages && data.messages.length > 0) {
                    messagesEl.innerHTML = '';
                    data.messages.forEach(function(msg) {
                        appendMessage(msg.role, msg.content, msg.intent, msg.action_data);
                    });
                }
                historyLoaded = true;
            })
            .catch(function(err) {
                console.error('Failed to load chat history:', err);
                historyLoaded = true;
            });
    }

    function togglePanel() {
        isOpen = !isOpen;
        if (isOpen) {
            panel.classList.add('open');
            iconOpen.style.display = 'none';
            iconClose.style.display = 'block';
            if (!socket.connected) socket.connect();
            if (!historyLoaded) loadHistory();
            inputEl.focus();
        } else {
            panel.classList.remove('open');
            iconOpen.style.display = 'block';
            iconClose.style.display = 'none';
        }
    }

    function sendMessage() {
        var text = inputEl.value.trim();
        if (!text || isStreaming) return;

        appendMessage('user', text);
        inputEl.value = '';
        inputEl.style.height = 'auto';
        charCountEl.textContent = '';

        replyDiv = null;
        replyText = '';
        setStreaming(true);
        typingEl.style.display = 'block';
        scrollToBottom();

        if (!socket.connected) socket.connect();
        socket.emit('chat_message', { message: text });
    }

    function cancelStream() {
        socket.emit('cancel_stream');
        if (replyDiv) {
            replyDiv.remove();
        }
        finishStream();
    }

    function clearHistory() {
        if (!confirm('Clear all chat history?')) return;
        fetch('/api/chat/history', { method: 'DELETE' })
            .then(function(r) { return r.json(); })
            .then(function(data) {
                if (data.success) {
                    messagesEl.innerHTML = '';
                    appendMessage('assistant', 'Chat history cleared. How can I help you?');
                }
            });
    }

    bubbleBtn.addEventListener('click', togglePanel);
    clearBtn.addEventListener('click', clearHistory);
    sendBtn.addEventListener('click', sendMessage);
    cancelBtn.addEventListener('click', cancelStream);

    inputEl.addEventListener('input', function() {
        this.style.height = 'auto';
        this.style.height = Math.min(this.scrollHeight, 80) + 'px';
        if (!isStreaming) sendBtn.disabled = !this.value.trim();
        var len = this.value.length;
        charCountEl.textContent = len > 0 ? len + '/2000' : '';
    });

    inputEl.addEventListener('keydown', function(e) {
        if (e.key === 'Enter' && !e.shiftKey) {
            e.preventDefault();
            if (inputEl.value.trim() && !isStreaming) sendMessage();
        }
    });
})();
</script>
