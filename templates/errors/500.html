<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Something Went Wrong - AI Career Coach</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/app.css') }}">
</head>
<body class="min-h-screen bg-gradient-to-br from-blue-50 to-indigo-100 flex items-center justify-center p-4">
    <div class="bg-white rounded-2xl shadow-2xl p-8 w-full max-w-md text-center">
        <div class="text-6xl font-bold text-red-600 mb-4">500</div>
        <h1 class="text-2xl font-bold text-gray-900 mb-2">Something Went Wrong</h1>
        <p class="text-gray-600 mb-6">
            We hit an unexpected error processing your request. The team has been notified — please try again in a moment.
        </p>
        <div class="flex gap-3 justify-center">
            <button onclick="window.location.reload()"
                    class="bg-indigo-600 hover:bg-indigo-700 text-white font-semibold px-6 py-3 rounded-lg transition">
                Retry
            </button>
            <a href="{{ url_for('auth.index') }}"
               class="bg-gray-200 hover:bg-gray-300 text-gray-800 font-semibold px-6 py-3 rounded-lg transition">
                Home
            </a>
        </div>
    </div>
</body>
</html>
