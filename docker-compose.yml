services:
  app:
    build: .
    ports:
      - "5001:5001"
    env_file: .env
    environment:
      DATABASE_URL: ${DATABASE_URL}
      REDIS_URL: ${REDIS_URL}
      CHECKPOINT_DB_PATH: ${CHECKPOINT_DB_PATH}
    extra_hosts:
      - "host.containers.internal:host-gateway"
    volumes:
      - ./uploads:/app/uploads
    restart: unless-stopped
