x-app-common: &app-common
  build: .
  env_file: .env
  environment: &app-env
    DATABASE_URL: ${DATABASE_URL}
    REDIS_URL: ${REDIS_URL}
    CHECKPOINT_DB_PATH: ${CHECKPOINT_DB_PATH}
    # Decouple the Job Scout: scheduled runs go through Celery Beat + worker
    # instead of in-process APScheduler, so the web tier can scale out.
    USE_CELERY: "true"
  extra_hosts:
    - "host.containers.internal:host-gateway"
  volumes:
    - ./uploads:/app/uploads
  restart: unless-stopped

services:
  app:
    <<: *app-common
    ports:
      - "5001:5001"

  # Celery worker — executes scout.run_for_user tasks off the web process.
  worker:
    <<: *app-common
    command: celery -A celery_worker.celery worker --loglevel=info -Q scout

  # Celery Beat — fires scout.dispatch_due every minute to fan out due users.
  beat:
    <<: *app-common
    command: celery -A celery_worker.celery beat --loglevel=info

  # Local PostgreSQL with pgvector, for running the Postgres-backed tests.
  # Not used by `python app.py`, which stays on SQLite.
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: careercoach
      POSTGRES_PASSWORD: localdev
      POSTGRES_DB: careercoach
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U careercoach"]
      interval: 5s
      retries: 10

volumes:
  pgdata:
